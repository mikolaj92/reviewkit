# Behavior only: role, pipeline, action policy. Pair with
# examples/packs/scientific_paper.json. Ontology, SourceUnits, and rules
# live in the Pack — not in this folder.
name = "scientific.reviewer"
language = "en"
document_type = "scientific paper"
reviewer_role = "peer reviewer"
review_pipeline = ["sentence", "paragraph", "section", "document"]

[action_policy]
# Fail-closed: do not silently rewrite scientific claims. A writing edit
# reaches corrected.docx only when the model hints it is safe and confidence
# clears the bar. Integrity findings stay comments or human decisions.
allowed_action_types_for_auto_apply = ["replace", "delete", "insert_before", "insert_after"]
block_when_requires_human_decision = true
require_llm_apply_hint = true
min_confidence_for_auto_apply = 0.9
max_severity_for_auto_apply = "low"

[action_policy.apply_policy]
typo = "apply"
grammar = "suggest"
punctuation = "suggest"
unclear_sentence = "suggest"
citation_needed = "comment"
citation_provenance = "comment"
overclaim = "comment"
claim_evidence = "comment"
p_hacking = "human_decision"
hallucinated_ref = "human_decision"
reporting_gap = "comment"
structure = "comment"

[outputs]
reviewed_docx = true
corrected_docx = true
