name: Takt integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native-binding:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false
      - name: Install Mojo toolchain
        run: >-
          pixi global install
          -c https://conda.modular.com/max
          -c conda-forge
          mojo==1.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Exercise native Takt binding
        run: uv run --frozen pytest tests/test_takt_integration.py -q
